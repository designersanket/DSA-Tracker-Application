
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSA Progress Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-color: #030712;
        --text-color: #f3f4f6;
        --card-bg: #111827;
        --border-color: #1f2937;
      }
      html.light {
        --bg-color: #ffffff;
        --text-color: #0f172a;
        --card-bg: #f8fafc;
        --border-color: #e2e8f0;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        min-height: 100vh;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #374151;
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }
      html.light ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #4b5563;
        background-clip: content-box;
      }
      html.light ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      
      /* Smooth transitions for theme switching */
      * {
        transition: background-color 0.2s ease, border-color 0.2s ease;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "framer-motion": "https://esm.sh/framer-motion@^12.34.0",
    "react-chartjs-2": "https://esm.sh/react-chartjs-2@^5.3.1",
    "@monaco-editor/react": "https://esm.sh/@monaco-editor/react@^4.7.0",
    "chart.js": "https://esm.sh/chart.js@^4.5.1",
    "date-fns": "https://esm.sh/date-fns@^4.1.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
